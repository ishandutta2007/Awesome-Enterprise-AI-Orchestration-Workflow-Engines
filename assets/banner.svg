<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.2)" />
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.6)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.45; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5; opacity: 0.8; }
      50% { r: 8; opacity: 1; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .bg-orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 250px 150px; }
    .bg-orb2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 950px 260px; }
    .stream-line { stroke-dasharray: 8 6; animation: dashMove 4s linear infinite; }
    .stream-line-rev { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite reverse; }
    .dynamic-node { animation: nodePulse 2.5s ease-in-out infinite; }
    .pill-hover { animation: floatPill 4s ease-in-out infinite; }
  </style>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle class="bg-orb1" cx="220" cy="140" r="140" fill="#38bdf8" filter="url(#orbGlow)" />
  <circle class="bg-orb2" cx="980" cy="240" r="160" fill="#a855f7" filter="url(#orbGlow)" />
  <circle class="bg-orb1" cx="620" cy="360" r="120" fill="#ec4899" filter="url(#orbGlow)" opacity="0.2" />

  <!-- Animated Background Circuit / Workflow Lines -->
  <g fill="none" opacity="0.45">
    <path d="M 60 80 Q 220 20 400 90 T 780 70 T 1140 100" stroke="#38bdf8" stroke-width="1.8" class="stream-line" />
    <path d="M 60 340 Q 280 400 560 330 T 940 370 T 1140 320" stroke="#c084fc" stroke-width="1.8" class="stream-line-rev" />
    <path d="M 120 180 C 260 120 320 280 500 240" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="4 4" />
    <path d="M 700 240 C 860 210 920 140 1080 180" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="4 4" />
  </g>

  <!-- Dynamic Connecting Pulsing Nodes -->
  <circle cx="400" cy="90" r="5" fill="#38bdf8" class="dynamic-node" filter="url(#glow)" />
  <circle cx="780" cy="70" r="6" fill="#818cf8" class="dynamic-node" filter="url(#glow)" />
  <circle cx="560" cy="330" r="5" fill="#c084fc" class="dynamic-node" filter="url(#glow)" />
  <circle cx="940" cy="370" r="6" fill="#f472b6" class="dynamic-node" filter="url(#glow)" />

  <!-- Foreground Content Area (Ensures text remains completely legible in foreground) -->
  
  <!-- Category Badge Pill -->
  <g transform="translate(420, 48)">
    <rect width="360" height="34" rx="17" fill="url(#pillGrad1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#38bdf8" filter="url(#glow)" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="1.5">ENTERPRISE AI ORCHESTRATION &amp; WORKFLOWS</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="-0.5">
    Awesome Enterprise AI Orchestration
  </text>
  <text x="600" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#f8fafc" letter-spacing="0.2">
    &amp; Workflow Engines
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#94a3b8" letter-spacing="0.4">
    Curated Hub of Commercial SaaS Platforms &amp; Top Open-Source Frameworks for MLOps, LLMOps &amp; Multi-Agent Systems
  </text>

  <!-- Dynamic Feature Badges / Highlights in Foreground -->
  <g transform="translate(140, 276)">
    <!-- Pill 1: Multi-Agent Workflows -->
    <g transform="translate(0, 0)" class="pill-hover">
      <rect width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <text x="22" y="26" font-size="16">🤖</text>
      <text x="48" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Multi-Agent Systems</text>
    </g>

    <!-- Pill 2: DAG Workflow Engines -->
    <g transform="translate(230, 0)" class="pill-hover" style="animation-delay: 0.5s;">
      <rect width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
      <text x="22" y="26" font-size="16">⚡</text>
      <text x="48" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">DAG Workflow Engines</text>
    </g>

    <!-- Pill 3: Enterprise MLOps & LLMOps -->
    <g transform="translate(460, 0)" class="pill-hover" style="animation-delay: 1.0s;">
      <rect width="230" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" />
      <text x="22" y="26" font-size="16">🔄</text>
      <text x="48" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Enterprise MLOps &amp; LLMOps</text>
    </g>

    <!-- Pill 4: GPU Cluster Scheduling -->
    <g transform="translate(710, 0)" class="pill-hover" style="animation-delay: 1.5s;">
      <rect width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.2" />
      <text x="20" y="26" font-size="16">🚀</text>
      <text x="46" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">GPU Cluster Scheduling</text>
    </g>
  </g>

  <!-- Modern bottom divider glow line -->
  <line x1="150" y1="365" x2="1050" y2="365" stroke="url(#lineGrad1)" stroke-width="1.5" />
</svg>
